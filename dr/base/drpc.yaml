---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPlacementControl
metadata:
  name: drpc
spec:
  # Customize in your overlay.
  preferredCluster: PREFERRED_CLUSTER
  drPolicyRef:
    name: dr-policy
  placementRef:
    kind: Placement
    name: placement
  pvcSelector:
    matchLabels:
      appname: busybox
