---
resources:
  - ../base
namespace: regionaldr-testv1
commonLabels:
  app: sftpgo
patches:
  # Customize path to application.
  - target:
      kind: Subscription
      name: subscription-sftpgo
    patch: |-
      - op: replace
        path: /metadata/annotations/apps.open-cluster-management.io~1github-path
        value: workloads/deployment/k8s-regional-cephfs-sftpgo
