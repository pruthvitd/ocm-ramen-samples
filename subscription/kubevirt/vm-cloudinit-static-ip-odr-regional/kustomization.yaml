# Subscription overlay: deploys the vm-cloudinit-static-ip workload
# from the odr-regional workload overlay via ACM Subscription.
---
resources:
  - ../base-odr
namespace: vm-cloudinit-static-ip
labels:
  - pairs:
      app: vm-cloudinit-static-ip
patches:
  - target:
      kind: Subscription
      name: subscription
    patch: |-
      - op: replace
        path: /metadata/annotations/apps.open-cluster-management.io~1github-path
        value: workloads/kubevirt/vm-cloudinit-static-ip/odr-regional
