---
resources:
  - ../../base
namespace: vm-pvc
commonLabels:
  app: vm-pvc
patches:
  - target:
      kind: ApplicationSet
      name: appset
    patch: |-
      - op: replace
        path: /spec/template/spec/source/path
        value: workloads/kubevirt/vm-pvc/k8s-regional
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: vm-pvc
