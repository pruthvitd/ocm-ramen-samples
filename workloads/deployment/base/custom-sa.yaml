apiVersion: v1
kind: ServiceAccount
metadata:
  name: busybox-sa
  namespace: regionaldr-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: busybox-sa-anyuid
subjects:
  - kind: ServiceAccount
    name: busybox-sa
    namespace: regionaldr-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:custom-scc
  namespace: regionaldr-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:custom-scc
subjects:
- kind: ServiceAccount
  name: busybox-sa
  namespace: regionaldr-test

