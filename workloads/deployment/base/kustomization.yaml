---
# Main kustomization for DR-enabled application
# 
# Deployment Strategy:
# 1. Deploy dr-prerequisites to BOTH managed clusters first
# 2. Deploy application-resources via ApplicationSet (will move during DR)
#
# DR Behavior:
# - dr-prerequisites: Protected from deletion, exist on both clusters
# - application-resources: Move with the application during failover/relocate
resources:
  - dr-prerequisites
  - application-resources

