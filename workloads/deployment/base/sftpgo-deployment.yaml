apiVersion: v1
kind: Namespace
metadata:
  name: regionaldr-testv1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    regionaldr: test
  name: pvc-app
  namespace: regionaldr-testv1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  storageClassName: rook-cephfs-fs1
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    regionaldr: test
  name: pvc-app-new
  namespace: regionaldr-testv1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  storageClassName: rook-cephfs-fs1
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    regionaldr: test
  name: sftpgo
  namespace: regionaldr-testv1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  storageClassName: rook-cephfs-fs1
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    regionaldr: test
  name: sftpgo-users-pvc
  namespace: regionaldr-testv1
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
  storageClassName: rook-cephfs-fs1
  volumeMode: Filesystem
---
apiVersion: v1
data:
  sftpgo.json: '{ "common": { "umask": "002" } }'
kind: ConfigMap
metadata:
  name: sftpgo
  namespace: regionaldr-testv1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custom-sa
  namespace: regionaldr-testv1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftpgo
  namespace: regionaldr-testv1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo
      app.kubernetes.io/name: sftpgo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sftpgo
        app.kubernetes.io/name: sftpgo
    spec:
      containers:
      - args:
        - sftpgo
        - serve
        env:
        - name: SFTPGO_SFTPD__BINDINGS__0__PORT
          value: '2022'
        - name: SFTPGO_SFTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_HTTPD__BINDINGS__0__PORT
          value: '8080'
        - name: SFTPGO_HTTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_TELEMETRY__BIND_PORT
          value: '10000'
        - name: SFTPGO_TELEMETRY__BIND_ADDRESS
          value: 0.0.0.0
        image: quay.io/prd/t24x-creg.ps1.platform.vpbank.cloud/sftpgo/sftpgo:v2.6.6-alpine
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: telemetry
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: sftpgo
        ports:
        - containerPort: 2022
          name: sftp
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 10000
          name: telemetry
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: telemetry
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /etc/sftpgo/sftpgo.json
          name: config
          readOnly: true
          subPath: sftpgo.json
        - mountPath: /var/lib/sftpgo
          name: sftpgo-volume
        - mountPath: /srv/sftpgo
          name: sftpg-data
        - mountPath: /srv/sftpgo-users
          name: sftpg-users
        - mountPath: /srv/sftpgo-new
          name: sftpg-data-new
      securityContext:
        fsGroup: 2000
      serviceAccountName: custom-sa
      volumes:
      - configMap:
          name: sftpgo
        name: config
      - name: sftpgo-volume
        persistentVolumeClaim:
          claimName: sftpgo
      - name: sftpg-data
        persistentVolumeClaim:
          claimName: pvc-app
      - name: sftpg-users
        persistentVolumeClaim:
          claimName: sftpgo-users-pvc
      - name: sftpg-data-new
        persistentVolumeClaim:
          claimName: pvc-app-new
