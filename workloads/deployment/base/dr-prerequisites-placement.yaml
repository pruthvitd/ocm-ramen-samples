---
# Placement to select ALL managed clusters for DR prerequisites
# This ensures prerequisites are deployed to all clusters in the DR topology
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: sftpgo-dr-prerequisites-placement
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - cluster1  # Replace with your cluster names
                - cluster2  # Add all clusters in DR topology

