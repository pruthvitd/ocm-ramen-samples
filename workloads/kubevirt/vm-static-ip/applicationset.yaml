# ACM ApplicationSet for deploying VMs with UDN static IPs across DR clusters
# This ApplicationSet uses the cluster name to automatically select the correct
# overlay (dr1 or dr2), which applies site-specific subnet and IP configurations.
#
# Prerequisites:
# 1. Label your ManagedClusters with appropriate names (dr1, dr2)
# 2. Ensure clusters have the correct DR-related labels
#
# When Ramen relocates the application from dr1 to dr2, ACM will automatically
# instantiate a new Application pointing to the dr2 overlay with correct IPs.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vm-static-ip-dr
  namespace: openshift-gitops
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            # Select clusters that are labeled as DR sites
            - key: name
              operator: In
              values:
                - dr1
                - dr2

  template:
    metadata:
      name: 'vm-static-ip-{{name}}'
      labels:
        app: vm-static-ip
        cluster: '{{name}}'

    spec:
      project: default

      source:
        repoURL: https://github.com/pruthvitd/ocm-ramen-samples.git
        targetRevision: gitops-udn-primary-vm
        # Path dynamically selects the overlay based on cluster name
        path: 'workloads/kubevirt/vm-static-ip/overlays/{{name}}'

      destination:
        server: '{{server}}'
        namespace: vm-static-ip

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
