# ammahapa-prd-c2 UDN overlay - network infrastructure
# Subnet: 192.168.200.0/24
---
namespace: vm-static-ip

resources:
  - ../../base-udn

patches:
  - target:
      kind: UserDefinedNetwork
      name: primary-udn
    patch: |-
      - op: replace
        path: /spec/layer2/subnets/0
        value: "192.168.200.0/24"
