# ApplicationSet for UDN infrastructure - ammahapa clusters
# Deploys to BOTH clusters (ammahapa-prd-c1 AND ammahapa-prd-c2)
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vm-static-ip-udn
  namespace: openshift-gitops
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            # Deploy UDN to both ammahapa clusters
            - key: name
              operator: In
              values:
                - ammahapa-prd-c1
                - ammahapa-prd-c2

  template:
    metadata:
      name: 'vm-static-ip-udn-{{name}}'
      labels:
        app: vm-static-ip-udn
        cluster: '{{name}}'
        component: network-infrastructure

    spec:
      project: default

      source:
        repoURL: https://github.com/pruthvitd/ocm-ramen-samples.git
        targetRevision: gitops-udn-primary-vm
        # This will generate paths like:
        # - workloads/kubevirt/vm-static-ip/overlays/ammahapa-prd-c1-udn
        # - workloads/kubevirt/vm-static-ip/overlays/ammahapa-prd-c2-udn
        path: 'workloads/kubevirt/vm-static-ip/overlays/{{name}}-udn'

      destination:
        server: '{{server}}'
        namespace: vm-static-ip

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
