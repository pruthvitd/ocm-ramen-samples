# cloud-init networkData secrets referenced by the VMs.
# The networkData field contains Network Config Version 2 YAML that
# cloud-init uses to configure the secondary (flat-L2) interface (eth1)
# with a static IP address on each site.
#
# *** DR Secret Patching ***
# When Ramen relocates / fails-over the application to the DR site,
# these secrets must be patched so that the new site IP addresses are
# used.  A separate ConfigMap (dr-network-patch-config.yaml) carries
# the site-specific IP mappings, and the DRPlacementControl webhook /
# Ramen hooks apply the patches by updating `networkData` in this secret
# before the VM is started on the target cluster.
---
apiVersion: v1
kind: Secret
metadata:
  name: vm-server-network-config
  labels:
    appname: vm-cloudinit-static-ip
    ramendr.openshift.io/k8s-resource-selector: vm-cloudinit-static-ip
type: Opaque
stringData:
  # Network Config Version 2 – configure eth1 (secondary flat-L2 overlay)
  # with a static IP.  This IP belongs to the DC (primary) site subnet.
  # Ramen patches this value to the DR-site IP when failing over.
  networkData: |
    version: 2
    ethernets:
      eth1:
        addresses: [ 192.0.2.20/24 ]
---
apiVersion: v1
kind: Secret
metadata:
  name: vm-client-network-config
  labels:
    appname: vm-cloudinit-static-ip
    ramendr.openshift.io/k8s-resource-selector: vm-cloudinit-static-ip
type: Opaque
stringData:
  networkData: |
    version: 2
    ethernets:
      eth1:
        addresses: [ 192.0.2.10/24 ]
