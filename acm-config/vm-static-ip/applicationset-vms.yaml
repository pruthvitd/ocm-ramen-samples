# ApplicationSet for VM Workload
# Deploys VMs ONLY to the cluster selected by Placement
# Follows Placement decisions - automatically moves VMs during DR failover
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vm-static-ip-vms
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Deploy after UDN is healthy
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: vm-static-ip-placement
        requeueAfterSeconds: 30

  template:
    metadata:
      name: 'vm-static-ip-vms-{{clusterName}}'
      labels:
        app: vm-static-ip-vms
        cluster: '{{clusterName}}'
        component: application

    spec:
      project: default

      source:
        repoURL: https://github.com/pruthvitd/ocm-ramen-samples.git
        targetRevision: gitops-udn-primary-vm
        path: 'workloads/kubevirt/vm-static-ip/overlays/{{clusterName}}-vms'

      destination:
        server: '{{server}}'
        namespace: vm-static-ip

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
